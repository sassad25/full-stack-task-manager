server:
  port: 8085

spring:
  application:
    name: task-manager-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum!!}
    ttl: 2h
    issuer: task-manager

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
